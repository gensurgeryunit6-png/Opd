<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5f8a"><title>IGMCRI Surgery OPD Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;color:#162235;background:#f3f6fa;font-size:15px}*{box-sizing:border-box}body{margin:0}.top{background:linear-gradient(135deg,#073b60,#0b6f96);color:#fff;padding:14px 18px;box-shadow:0 3px 14px #14243a22}.brand{font-size:19px;font-weight:800}.sub{font-size:12px;opacity:.9;margin-top:3px}.wrap{max-width:1400px;margin:auto;padding:12px}.nav{display:flex;gap:7px;overflow:auto;margin:10px 0}.nav button{white-space:nowrap}.card{background:#fff;border:1px solid #dce4ee;border-radius:14px;padding:15px;box-shadow:0 3px 14px #1620330b;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}h2{font-size:21px;margin:2px 0 14px;color:#10243a}h3{font-size:16px;color:#16364e}label{font-size:13px;font-weight:700;display:block;margin:3px 0 6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #c9d4e1;border-radius:9px;background:#fff;font:inherit;min-height:43px}textarea{min-height:70px}button{border:0;border-radius:9px;padding:10px 14px;background:#0b648f;color:#fff;font-weight:750;cursor:pointer;min-height:40px}button.secondary{background:#e8eef5;color:#17324a}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.muted{color:#68788c;font-size:13px}.stat{font-size:28px;font-weight:850;color:#0b5f8a}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf4f8;color:#28536a;font-size:11px;font-weight:700}.tablewrap{overflow:auto;border:1px solid #e1e7ee;border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:850px;font-size:13px}.table th,.table td{padding:8px;border-bottom:1px solid #e5ebf1;text-align:left;vertical-align:top}.table th{background:#edf3f7;font-size:12px;position:sticky;top:0}.login{max-width:430px;margin:10vh auto}.toast{position:fixed;right:14px;bottom:14px;background:#17324a;color:#fff;padding:12px 15px;border-radius:10px;z-index:50}.filters{display:flex;gap:8px;flex-wrap:wrap;background:#f7fafc;border:1px solid #dfe7ef;padding:10px;border-radius:11px;margin-bottom:12px}.filters select{width:auto;min-width:140px}.suggest{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}.suggest button{background:#e8f1f6;color:#16455d;padding:7px 10px;min-height:34px;font-size:12px}.req{color:#b42318}.print-title{display:none}@media(max-width:750px){.grid,.grid3{grid-template-columns:1fr}.wide{grid-column:auto}.wrap{padding:8px}.card{padding:12px}.top{padding:12px}.brand{font-size:17px}input,select,textarea{font-size:16px}.filters select{width:100%}.table{min-width:900px}}
@media print{body{background:#fff}.top,.nav,.no-print,.filters,.actions{display:none!important}.wrap{max-width:none;padding:0}.card{box-shadow:none;border:0}.print-title{display:block;text-align:center}.table{min-width:0;font-size:10px}.table th,.table td{padding:5px}}
</style></head><body><div id="app"><div class="login card"><h2>IGMCRI Surgery</h2><p class="muted">Loading…</p></div></div><script>
const CONFIG={url:'https://pnncnljakqrqzocahxhs.supabase.co',key:'sb_publishable_cga5rEYY_gFG3KZ2Kpvb9g_ZoHKiYJd'};const db=supabase.createClient(CONFIG.url,CONFIG.key);let user=null,view='dashboard',selected=null;
const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(x){const d=document.createElement('div');d.className='toast';d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
async function boot(){const r=await db.auth.getUser();user=r.data.user;if(!user)return login();home()}
function login(){app.innerHTML='<div class="login card"><h2>IGMCRI Surgery</h2><p class="muted">OPD • Waiting Lists • Major OT • Minor OT • Endoscopy • Follow-up</p><form id="login"><label>Username</label><input id="un" autocomplete="username" placeholder="admin" required><label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="1234" required><div class="actions"><button>Sign in</button></div><p class="muted">Username: admin &nbsp; Password: 1234</p></form></div>';login.onsubmit=async e=>{e.preventDefault();if(un.value.trim().toLowerCase()!=='admin')return toast('Use username admin');const r=await db.auth.signInWithPassword({email:'admin@igmcri.local',password:pw.value});if(r.error)toast(r.error.message);else location.reload()}}
function home(){app.innerHTML='<header class="top"><div class="brand">IGMCRI • Department of General Surgery</div><div class="sub">OPD & Clinical Workflow Manager</div></header><main class="wrap"><nav class="nav"><button onclick="go(\'dashboard\')">Dashboard</button><button onclick="go(\'opd\')">OPD Registration</button><button onclick="go(\'waiting\')">Waiting Lists</button><button onclick="go(\'major\')">Major OT</button><button onclick="go(\'minor\')">Minor OT</button><button onclick="go(\'endo\')">Endoscopy</button><button onclick="go(\'follow\')">Follow-up</button><button onclick="go(\'ot\')">OT List Generator</button><button class="secondary" onclick="db.auth.signOut().then(()=>location.reload())">Sign out</button></nav><section id="view"></section></main>';go(view)}
function patientForm(p='p'){return `<div class="grid"><div><label>Patient Name <span class="req">*</span></label><input id="${p}name" required></div><div><label>Hospital / UHID No.</label><input id="${p}hno"></div><div><label>OP No.</label><input id="${p}op"></div><div><label>IP No.</label><input id="${p}ip"></div><div><label>Age</label><input id="${p}age" type="number" min="0" max="120"></div><div><label>Sex</label><select id="${p}sex"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div><label>Mobile 1</label><input id="${p}m1" inputmode="tel"></div><div><label>Mobile 2</label><input id="${p}m2" inputmode="tel"></div><div><label>Blood Group</label><select id="${p}bg"><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div><div><label>Patient Photo</label><input id="${p}photo" type="file" accept="image/*" capture="environment"></div></div>`}
function setPatient(p,pre='p'){selected=p;const map={name:p.name,hno:p.hospital_no||'',op:p.op_no||'',ip:p.ip_no||'',age:p.age||'',sex:p.sex||'',m1:p.mobile||'',m2:p.mobile2||'',bg:p.blood_group||''};Object.entries(map).forEach(([k,v])=>{const el=$(pre+k);if(el)el.value=v});toast('Patient details autopopulated')}
async function searchPatient(pre='p'){const q=($(pre==='p'?'search':'search2').value||'').trim();if(!q)return;const r=await db.from('patients').select('*').or(`name.ilike.%${q}%,mobile.ilike.%${q}%,mobile2.ilike.%${q}%,hospital_no.ilike.%${q}%,op_no.ilike.%${q}%,ip_no.ilike.%${q}%`).limit(10);if(r.error)return toast(r.error.message);$('results').innerHTML=(r.data||[]).map(p=>`<div class="card"><b>${esc(p.name)}</b> <span class="pill">${esc(p.op_no||p.ip_no||p.hospital_no||'')}</span><div class="muted">${esc(p.age)} / ${esc(p.sex)} • ${esc(p.mobile||'')} ${p.mobile2?'• '+esc(p.mobile2):''}</div><button onclick='setPatient(${JSON.stringify(p)})'>Use / Autopopulate</button></div>`).join('')||'<p class="muted">No patient found.</p>'}
async function patientSave(pre='p'){const file=$(pre+'photo')?.files?.[0];const p={name:$(pre+'name').value.trim(),hospital_no:$(pre+'hno').value||null,op_no:$(pre+'op').value||null,ip_no:$(pre+'ip').value||null,age:Number($(pre+'age').value)||null,sex:$(pre+'sex').value||null,mobile:$(pre+'m1').value||null,mobile2:$(pre+'m2').value||null,blood_group:$(pre+'bg').value||null};let r=await db.from('patients').insert(p).select().single();if(r.error&&p.hospital_no)r=await db.from('patients').select('*').eq('hospital_no',p.hospital_no).maybeSingle();if(r.error||!r.data)throw r.error||new Error('Patient save failed');let pt=r.data;if(file){const path=`${pt.id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const u=await db.storage.from('patient-photos').upload(path,file);if(!u.error)await db.from('patients').update({photo_path:path}).eq('id',pt.id)}selected=pt;return pt}
function opd(){view='opd';$('view').innerHTML=`<div class="card"><h2>OPD Patient Registration</h2><div class="filters"><input id="search" placeholder="Search name / mobile / OP / IP / UHID" onkeydown="if(event.key==='Enter')searchPatient()"><button onclick="searchPatient()">Search</button></div><div id="results"></div><form id="opdform"><h3>Patient</h3>${patientForm()}<div class="grid"><div><label>Visit Type</label><select id="vtype"><option>New</option><option>Follow-up</option><option>Post-op</option><option>Referral</option></select></div><div><label>Unit</label><select id="unit"><option>S1</option><option>S2</option><option>S3</option><option>S4</option><option>S5</option><option>S6</option></select></div><div><label>Doctor</label><input id="doctor"></div><div><label>Visit Date</label><input id="vdate" type="date" value="${today()}"></div><div class="wide"><label>Diagnosis</label><textarea id="diag"></textarea><div class="suggest"><button type="button" onclick="diag.value='Inguinal hernia'">Inguinal hernia</button><button type="button" onclick="diag.value='Cholelithiasis'">Cholelithiasis</button><button type="button" onclick="diag.value='Appendicitis'">Appendicitis</button><button type="button" onclick="diag.value='Incisional hernia'">Incisional hernia</button></div></div><div><label>Laterality</label><select id="lat"><option>Not applicable</option><option>Right</option><option>Left</option><option>Bilateral</option></select></div><div class="wide"><label>Plan / Advice</label><textarea id="plan"></textarea></div><div class="wide"><label>Add to waiting list</label><label><input type="checkbox" id="majorx"> Major OT</label><label><input type="checkbox" id="minorx"> Minor OT</label><label><input type="checkbox" id="endox"> Endoscopy</label><label><input type="checkbox" id="followx"> Follow-up</label></div></div><div class="actions"><button>Save OPD Registration</button></div></form></div>`;opdform.onsubmit=saveOPD}
async function saveOPD(e){e.preventDefault();try{const p=selected||await patientSave();const x={patient_id:p.id,visit_date:vdate.value,unit:unit.value,doctor:doctor.value,visit_type:vtype.value,provisional_diagnosis:diag.value,laterality:lat.value,plan:plan.value,created_by:user.id};const r=await db.from('opd_visits').insert(x);if(r.error)throw r.error;for(const [id,type] of [['majorx','Major OT'],['minorx','Minor OT'],['endox','Endoscopy'],['followx','Follow-up']])if($(id).checked)await addWaiting(p.id,type,vdate.value);toast('OPD registration saved');selected=null;go('dashboard')}catch(e){toast(e.message)}}
async function addWaiting(pid,type,date){let seq=null;try{seq=(await db.rpc('next_waiting_sequence',{p_date:date,p_source:type})).data}catch(_){}const r=await db.from('waiting_list').insert({patient_id:pid,source_type:type,list_date:date,sequence_no:seq,priority:'Routine',status:'Waiting',created_by:user.id});if(r.error)throw r.error}
async function waiting(){view='waiting';const d=today();const r=await db.from('waiting_list').select('*,patients(name,age,sex,op_no,ip_no,mobile,mobile2)').eq('list_date',d).order('sequence_no');if(r.error)return toast(r.error.message);const data=r.data||[];$('view').innerHTML=`<div class="card"><h2>Waiting Lists</h2><div class="filters"><select id="wf"><option>All</option><option>Major OT</option><option>Minor OT</option><option>Endoscopy</option><option>Follow-up</option></select><select id="ws"><option>All Status</option><option>Waiting</option><option>Called</option><option>Responded – Willing to come</option><option>Responded – Not willing</option><option>Not reachable</option><option>Not called</option></select><span class="pill" id="wc"></span></div><div id="wt"></div></div>`;function renderW(){let a=data.filter(x=>(wf.value==='All'||x.source_type===wf.value)&&(ws.value==='All Status'||x.status===ws.value));wc.textContent=a.length+' patients';wt.innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>List</th><th>Patient</th><th>Age/Sex</th><th>Mobile 1</th><th>Mobile 2</th><th>Priority</th><th>Calling Response</th><th>Action</th></tr></thead><tbody>${a.map(x=>`<tr><td>${x.sequence_no||''}</td><td>${esc(x.source_type)}</td><td><b>${esc(x.patients?.name)}</b><br>${esc(x.patients?.op_no||x.patients?.ip_no||'')}</td><td>${esc(x.patients?.age)} / ${esc(x.patients?.sex)}</td><td>${esc(x.patients?.mobile)}</td><td>${esc(x.patients?.mobile2)}</td><td><select onchange="upd('${x.id}','priority',this.value)"><option ${x.priority==='Routine'?'selected':''}>Routine</option><option ${x.priority==='Priority'?'selected':''}>Priority</option><option ${x.priority==='Urgent'?'selected':''}>Urgent</option></select></td><td><select onchange="upd('${x.id}','status',this.value)"><option>Not called</option><option>Responded – Willing to come</option><option>Responded – Not willing</option><option>Not reachable</option><option>Called</option></select></td><td><button onclick="editMobile('${x.patient_id}')">Edit mobile</button></td></tr>`).join('')}</tbody></table></div>`}wf.onchange=renderW;ws.onchange=renderW;renderW()}
async function upd(id,col,val){const r=await db.from('waiting_list').update({[col]:val,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)toast(r.error.message)}async function editMobile(pid){const a=prompt('Mobile 1');if(a===null)return;const b=prompt('Mobile 2');const r=await db.from('patients').update({mobile:a,mobile2:b||null}).eq('id',pid);if(r.error)toast(r.error.message);else toast('Mobile numbers updated')}
function otForm(kind){view=kind==='Major OT'?'major':kind==='Minor OT'?'minor':'endo';$('view').innerHTML=`<div class="card"><h2>${kind} Registration</h2><div class="filters"><input id="search2" placeholder="Search existing patient"><button onclick="searchPatient('q')">Search</button></div><div id="results"></div><form id="otf"><h3>Patient</h3>${patientForm('q')}<div class="grid"><div><label>Planned Date</label><input id="odate" type="date" value="${today()}"></div><div><label>Priority</label><select id="opriority"><option>Routine</option><option>Priority</option><option>Urgent</option><option>Emergency</option></select></div><div><label>Ward</label><select id="ward"><option>MSW</option><option>PSW</option><option>Special Ward</option><option>SICU</option><option>ICU</option></select></div><div><label>Availability</label><select id="avail"><option>Available</option><option>Not available</option><option>Pending confirmation</option></select></div><div class="wide"><label>Diagnosis</label><textarea id="odiag"></textarea></div><div><label>Laterality</label><select id="olat"><option>Not applicable</option><option>Right</option><option>Left</option><option>Bilateral</option></select></div><div class="wide"><label>Planned Procedure</label><input id="proc" required></div><div><label>Consultant / Surgeon</label><input id="surgeon"></div><div><label>OP/IP No.</label><input id="opip"></div></div><div class="actions"><button>Save ${kind}</button></div></form></div>`;otf.onsubmit=saveOT}
async function saveOT(e){e.preventDefault();try{const kind=view==='major'?'Major OT':view==='minor'?'Minor OT':'Endoscopy';const p=selected||await patientSave('q');let table,pl={patient_id:p.id,priority:opriority.value,created_by:user.id};if(kind==='Major OT'){table='major_ot_list';Object.assign(pl,{tentative_date:odate.value,planned_procedure:proc.value,diagnosis:odiag.value,laterality:olat.value,surgeon:surgeon.value,op_ip_no:opip.value,ward_bed:ward.value,availability:avail.value})}else if(kind==='Minor OT'){table='minor_ot_list';Object.assign(pl,{planned_date:odate.value,procedure:proc.value,diagnosis:odiag.value,laterality:olat.value,doctor:surgeon.value,op_no:opip.value,ward_bed:ward.value,availability:avail.value})}else{table='endoscopy_list';Object.assign(pl,{planned_date:odate.value,procedure:proc.value,indication:odiag.value,endoscopist:surgeon.value,ip_no:opip.value,ward_bed:ward.value,availability:avail.value})}const r=await db.from(table).insert(pl).select().single();if(r.error)throw r.error;await addWaiting(p.id,kind,odate.value);toast(kind+' saved');selected=null;go('waiting')}catch(e){toast(e.message)}}
function follow(){view='follow';$('view').innerHTML=`<div class="card"><h2>Follow-up</h2><form id="ff">${patientForm('f')}<div class="grid"><div><label>Follow-up Date</label><input id="fdate" type="date" value="${today()}"></div><div><label>Unit</label><select id="funit"><option>S1</option><option>S2</option><option>S3</option><option>S4</option><option>S5</option><option>S6</option></select></div><div class="wide"><label>Reason / Plan</label><textarea id="fplan"></textarea></div></div><div class="actions"><button>Save Follow-up</button></div></form></div>`;ff.onsubmit=async e=>{e.preventDefault();try{const p=selected||await patientSave('f');const r=await db.from('followups').insert({patient_id:p.id,followup_date:fdate.value,unit:funit.value,plan:fplan.value,created_by:user.id});if(r.error)throw r.error;await addWaiting(p.id,'Follow-up',fdate.value);toast('Follow-up saved');go('waiting')}catch(e){toast(e.message)}}}
async function otgen(){view='ot';const d=today();const r=await db.from('major_ot_list').select('*,patients(name,age,sex,op_no,ip_no)').eq('tentative_date',d).neq('status','Cancelled').order('created_at');if(r.error)return toast(r.error.message);const a=r.data||[];$('view').innerHTML=`<div class="card"><div class="no-print"><h2>OT List Generator</h2><div class="actions"><input id="otd" type="date" value="${d}"><button onclick="makeOT()">Generate</button><button onclick="printWord()">Print / Word</button></div></div><div id="otprint"><div class="print-title"><h2>INDIRA GANDHI MEDICAL COLLEGE & RESEARCH INSTITUTE, PUDUCHERRY</h2><b>DEPARTMENT OF GENERAL SURGERY – UNIT S-6</b><h3>OT 3 – MAJOR OT – MORNING LIST</h3><div>Date: ${d} &nbsp; Consultant: __________________ &nbsp; Total Cases: ${a.length}</div></div><div class="tablewrap"><table class="table"><thead><tr><th>Sl. No.</th><th>Patient</th><th>Age/Sex</th><th>IP No.</th><th>Diagnosis</th><th>Planned Procedure</th><th>Ane.</th><th>Serology</th><th>Position</th><th>OT room In Time</th><th>Spinal/Intubation time</th><th>Closure time</th><th>Extubation Time</th><th>Shift Out Time</th></tr></thead><tbody>${a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.patients?.name)}</td><td>${esc(x.patients?.age)} / ${esc(x.patients?.sex)}</td><td>${esc(x.op_ip_no||x.patients?.ip_no)}</td><td>${esc(x.diagnosis)}</td><td>${esc(x.planned_procedure)}</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join('')}</tbody></table></div><p class="print-title" style="text-align:left;margin-top:18px"><b>Unit Chief:</b> ____________________________<br><br><b>Copy to:</b> OT In-charge / Anaesthesia / Nursing / Unit File</p></div></div>`}
async function makeOT(){const d=otd.value;const r=await db.from('major_ot_list').select('*,patients(name,age,sex,op_no,ip_no)').eq('tentative_date',d).neq('status','Cancelled').order('created_at');if(r.error)return toast(r.error.message);const a=r.data||[];document.querySelector('#otprint tbody').innerHTML=a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.patients?.name)}</td><td>${esc(x.patients?.age)} / ${esc(x.patients?.sex)}</td><td>${esc(x.op_ip_no||x.patients?.ip_no)}</td><td>${esc(x.diagnosis)}</td><td>${esc(x.planned_procedure)}</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join('')}
function printWord(){const h=document.getElementById('otprint').innerHTML;const blob=new Blob(['<html><head><meta charset="utf-8"><style>body{font-family:Arial;font-size:10pt}table{border-collapse:collapse;width:100%}th,td{border:1px solid #222;padding:5px}th{background:#eee}</style></head><body>'+h+'</body></html>'],{type:'application/msword'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='IGMCRI_Major_OT_List.doc';a.click();URL.revokeObjectURL(u);window.print()}
async function dashboard(){view='dashboard';const names=['patients','opd_visits','major_ot_list','minor_ot_list','endoscopy_list','followups'];const rs=await Promise.all(names.map(n=>db.from(n).select('*',{count:'exact',head:true})));$('view').innerHTML=`<div class="grid3">${names.map((n,i)=>`<div class="card"><div class="muted">${n.replaceAll('_',' ')}</div><div class="stat">${rs[i].count??0}</div></div>`).join('')}</div><div class="card"><h2>Workflow</h2><p>Register or search a patient → autopopulate details → OPD → add to Major / Minor / Endoscopy / Follow-up → generate waiting lists and Major OT list.</p></div>`}
function go(t){view=t;if(t==='dashboard')dashboard();else if(t==='opd')opd();else if(t==='waiting')waiting();else if(t==='major')otForm('Major OT');else if(t==='minor')otForm('Minor OT');else if(t==='endo')otForm('Endoscopy');else if(t==='follow')follow();else if(t==='ot')otgen()}
boot();
</script></body></html>
